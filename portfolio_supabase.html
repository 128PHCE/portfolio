function showToast(msg, dur=2500) {
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(),dur);
}

const sbHeaders = () => ({
  'apikey': SUPA_KEY,
  'Authorization': 'Bearer ' + SUPA_KEY,
  'Content-Type': 'application/json',
  'Prefer': 'return=representation'
});

async function sbGet(table, qs='') {
  const res = await fetch(SUPA_URL+'/rest/v1/'+table+'?select=*'+(qs?'&'+qs:''), {
    method:'GET', mode:'cors', headers: sbHeaders()
  });
  if(!res.ok) throw new Error('HTTP '+res.status);
  const text = await res.text(); return text ? JSON.parse(text) : [];
}
async function sbUpsert(table, row) {
  const res = await fetch(SUPA_URL+'/rest/v1/'+table, {
    method:'POST', mode:'cors',
    headers: {...sbHeaders(), 'Prefer':'resolution=merge-duplicates,return=representation'},
    body: JSON.stringify(row)
  });
  return res.ok;
}
async function sbDelete(table, id) {
  await fetch(SUPA_URL+'/rest/v1/'+table+'?id=eq.'+id, {method:'DELETE', mode:'cors', headers: sbHeaders()});
}
async function sbPatch(table, data, qs) {
  await fetch(SUPA_URL+'/rest/v1/'+table+'?'+qs, {method:'PATCH', mode:'cors', headers: sbHeaders(), body: JSON.stringify(data)});
}

<script type="text/babel" data-presets="react">

const fmt = (n) => { if (!n && n !== 0) return "—"; return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(Number(n)); };
const fmtShort = (n) => { const v=Number(n)||0; if(v>=1e6) return `$${(v/1e6).toFixed(1)}M`; if(v>=1e3) return `$${(v/1e3).toFixed(0)}K`; return `$${v}`; };
const uid = () => Math.random().toString(36).slice(2,9);

function formatCommas(raw) {
  if (raw===""||raw===undefined||raw===null) return "";
  const s = String(raw).replace(/,/g,"");
  const n = parseFloat(s);
  if (isNaN(n)) return raw;
  const parts = s.split(".");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,",");
  return parts.join(".");
}
function stripCommas(s) { return String(s||"").replace(/,/g,""); }

const BLUES = ["#1E3A5F","#2E4A6E","#C9A84C","#8B6914","#374151","#4B5563","#2E7D32","#1B5E20","#8B1A1A","#6B2737"];

function Field({ label, value, onChange, type="text", placeholder="", prefix, half }) {
  const isNum = type==="number";
  return (
    <div style={{marginBottom:14,width:half?"calc(50% - 6px)":"100%"}}>
      <label style={{display:"block",fontSize:11,fontWeight:600,color:"#374151",letterSpacing:1,textTransform:"uppercase",marginBottom:5}}>{label}</label>
      <div style={{position:"relative"}}>
        {prefix && <span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",color:"#8A9BB0",fontSize:13}}>{prefix}</span>}
        <input type="text" inputMode={isNum?"decimal":"text"}
          value={isNum ? formatCommas(value) : value}
          onChange={e => { const v=e.target.value; onChange(isNum ? stripCommas(v.replace(/[^0-9.,\-]/g,"")) : v); }}
          placeholder={placeholder}
          style={{width:"100%",padding:prefix?"9px 10px 9px 22px":"9px 12px",border:"1.5px solid #D1D9E0",borderRadius:6,fontSize:13,color:"#1A2332",background:"#F7F8FA",outline:"none",boxSizing:"border-box",fontFamily:"inherit"}}
        />
      </div>
    </div>
  );
}
function Row({children}) { return <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>{children}</div>; }

function SectionHead({title,onAdd,addLabel,sortKey,setSortKey,sortDir,setSortDir,sortOptions}) {

      </div>
      {sortOptions && (

}

}

function DraggableList({items,onReorder,renderItem}) {
  const [dragIdx,setDragIdx]=useState(null);
  const [overIdx,setOverIdx]=useState(null);
  return (
    <div>
      {items.map((item,i)=>(
        <div key={item.id} draggable
          onDragStart={e=>{setDragIdx(i);e.dataTransfer.effectAllowed="move";}}
          onDragOver={e=>{e.preventDefault();setOverIdx(i);}}
          onDrop={e=>{
            e.preventDefault();
            if(dragIdx===null||dragIdx===i){setDragIdx(null);setOverIdx(null);return;}
            const next=[...items];const[m]=next.splice(dragIdx,1);next.splice(i,0,m);
            onReorder(next);setDragIdx(null);setOverIdx(null);
          }}
          onDragEnd={()=>{setDragIdx(null);setOverIdx(null);}}
          style={{opacity:dragIdx===i?0.4:1,transition:"opacity 0.15s, transform 0.15s",transform:overIdx===i&&dragIdx!==i?"translateY(-3px)":"none",borderTop:overIdx===i&&dragIdx!==i?"2px solid #C9A84C":"2px solid transparent",borderRadius:10,marginBottom:10}}
        >
          <div style={{display:"flex",alignItems:"stretch"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",width:26,minWidth:26,borderRadius:"10px 0 0 10px",background:"#EEF0F3",cursor:"grab",userSelect:"none"}}>

            </div>
            <div style={{flex:1,minWidth:0}}>{renderItem(item)}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

// ── Compliance Card ───────────────────────────────────────────
function ComplianceCard({item,daysUntil,urgencyColor,urgencyBg,onEdit,onDelete}) {
  const n = daysUntil(item.dueDate);
  const u = n===null?"gray":n<0?"red":n<=30?"red":n<=90?"amber":"green";
  const col = urgencyColor[u], bg = urgencyBg[u];
  const dueLabel = n===null?"No date set":n<0?`${Math.abs(n)} days overdue`:n===0?"Due today":`${n} days remaining`;
  return (
    <div style={{background:"#FFFFFF",borderRadius:12,padding:"16px 20px",boxShadow:"0 2px 8px rgba(10,20,40,0.07)",borderLeft:`3px solid ${col}`,marginBottom:8}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div style={{flex:1}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:4}}>
            <div style={{fontSize:14,fontWeight:700,color:"#1A2332"}}>{item.name||"Unnamed Item"}</div>
            {item.category&&<span style={{background:"#E8ECF0",color:"#1E3A5F",padding:"2px 8px",borderRadius:10,fontSize:10,fontWeight:600}}>{item.category}</span>}
          </div>
          <div style={{display:"flex",gap:16,fontSize:12,color:"#6B7A8D",marginBottom:10,flexWrap:"wrap"}}>
            {item.llc&&<span>{item.llc}</span>}
            {item.dueDate&&<span>Due: <strong>{item.dueDate}</strong></span>}
            {item.recurring&&<span>↻ {item.recurring}</span>}
          </div>
          <div style={{display:"inline-flex",alignItems:"center",gap:6,background:bg,color:col,padding:"4px 12px",borderRadius:20,fontSize:11,fontWeight:700}}>
            <span>{n!==null&&n<0?"⚠":n!==null&&n<=30?"!":"●"}</span> {dueLabel}
          </div>
          {item.notes&&<div style={{fontSize:11,color:"#E53935",fontStyle:"italic",marginTop:8}}>{item.notes}</div>}
        </div>
        <div style={{display:"flex",gap:8,marginLeft:12}}>
          <ActionBtn label="Edit" onClick={onEdit}/>
          <ActionBtn label="Delete" danger onClick={onDelete}/>
        </div>
      </div>
    </div>
  );
}

    debtPie:      {title:"Debt Breakdown",             accent:"#C9A84C",  span:1, content: debtMix.length>0?<ResponsiveContainer width="100%" height={180}><PieChart><Pie data={debtMix} dataKey="value" nameKey="name" cx="50%" cy="50%" outerRadius={65} label={({percent})=>`${(percent*100).toFixed(0)}%`} labelLine={false} fontSize={9}>{debtMix.map((_,i)=><Cell key={i} fill={["#C9A84C","#8B6914"][i%2]}/>)}</Pie><Tooltip formatter={v=>fmt(v)} contentStyle={TTs}/><Legend wrapperStyle={{fontSize:9}}/></PieChart></ResponsiveContainer>:<Empty msg="Add debt"/>},
    incomePie:    {title:"Income by Type",             accent:"#4A5568",  span:1, content: incomeByType.length>0?<ResponsiveContainer width="100%" height={180}><PieChart><Pie data={incomeByType} dataKey="value" nameKey="name" cx="50%" cy="50%" outerRadius={65} label={({percent})=>`${(percent*100).toFixed(0)}%`} labelLine={false} fontSize={9}>{incomeByType.map((_,i)=><Cell key={i} fill={["#2E7D32","#388E3C","#43A047","#1B5E20","#4CAF50"][i%5]}/>)}</Pie><Tooltip formatter={v=>fmt(v)} contentStyle={TTs}/><Legend wrapperStyle={{fontSize:9}}/></PieChart></ResponsiveContainer>:<Empty msg="Add income entries"/>},
    capTable:     {title:"Ownership Cap Table — All Entities", accent:"#1E3A5F", span:1, content: capTableData.length>0
      ?<div style={{maxHeight:220,overflowY:"auto"}}>{capTableData.map((row,i)=>(
        <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:"1px solid #E8ECF0"}}>
          <div>
            <div style={{fontSize:12,fontWeight:600,color:"#1A2332"}}>{row.owner}</div>
            <div style={{fontSize:10,color:"#8A9BB0"}}>{row.entity}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:13,fontWeight:700,color:"#1E3A5F"}}>{(row.pct*100).toFixed(0)}%</div>

              <div style={{width:`${Math.min(row.pct*100,100)}%`,height:"100%",background:"#1E3A5F",borderRadius:3}}/>
            </div>
          </div>
        </div>
      ))}</div>
      :<Empty msg="Add LLC owners to see cap table"/>},
    loanTypePie:  {title:"Loans by Type",              accent:"#8B1A1A",  span:1, content: loanByType.length>0?<ResponsiveContainer width="100%" height={180}><PieChart><Pie data={loanByType} dataKey="value" nameKey="name" cx="50%" cy="50%" outerRadius={65} label={({percent})=>`${(percent*100).toFixed(0)}%`} labelLine={false} fontSize={9}>{loanByType.map((_,i)=><Cell key={i} fill={["#8B1A1A","#A52A2A","#B03030","#6B0F0F"][i%4]}/>)}</Pie><Tooltip formatter={v=>fmt(v)} contentStyle={TTs}/><Legend wrapperStyle={{fontSize:9}}/></PieChart></ResponsiveContainer>:<Empty msg="Add loans"/>},
  };

  const dragHandle = (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",width:20,height:20,cursor:"grab",borderRadius:4,color:"#CBD5E1",fontSize:14,flexShrink:0,userSelect:"none"}}>⠿</div>
  );

  return (
    <div>
      {/* KPI row — draggable */}
      <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap",alignItems:"stretch"}}>
        {kpiOrder.map((id,i)=>{
          const k = kpiDefs[id];
          if(!k) return null;
          return (
            <div key={id} draggable
              onDragStart={e=>{setKpiDrag(i);e.dataTransfer.effectAllowed="move";}}
              onDragOver={e=>{e.preventDefault();setKpiOver(i);}}

              onDragEnd={()=>{setKpiDrag(null);setKpiOver(null);}}
              style={{opacity:kpiDrag===i?0.4:1,transition:"opacity 0.15s,transform 0.15s",transform:kpiOver===i&&kpiDrag!==i?"scale(1.02)":"scale(1)",outline:kpiOver===i&&kpiDrag!==i?"2px solid #C9A84C":"none",outlineOffset:2,borderRadius:12,flex:k.small?"0 0 auto":1,minWidth:k.small?110:130,cursor:"grab"}}>
              <div style={{background:"#fff",borderRadius:12,padding:k.small?"12px 16px":"18px 20px",height:"100%",borderTop:`3px solid ${k.accent}`,boxShadow:"0 1px 4px rgba(10,20,40,0.06),0 4px 20px rgba(10,20,40,0.07)",boxSizing:"border-box"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:k.small?5:8}}>
                  <div style={{fontSize:k.small?9:10,letterSpacing:3,textTransform:"uppercase",color:"#94A3B8",fontWeight:600}}>{k.label}</div>
                  <span style={{color:"#9AA5B4",fontSize:12,lineHeight:1}}>⠿</span>
                </div>
                <div style={{fontSize:k.small?15:22,fontWeight:700,color:"#1A2332",letterSpacing:-0.5}}>{k.value}</div>
                {k.sub && <div style={{fontSize:10,color:"#94A3B8",marginTop:3}}>{k.sub}</div>}
              </div>
            </div>
          );
        })}
      </div>

      {/* Net Position Banner */}
      {netPosition !== 0 && (
        <div style={{background:netPosition>=0?"linear-gradient(135deg,#1A2332,#1E3A5F)":"linear-gradient(135deg,#5C0A0A,#8B1A1A)",borderRadius:12,padding:"20px 28px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center",boxShadow:"0 4px 20px rgba(0,0,0,0.15)"}}>
          <div>
            <div style={{fontSize:10,letterSpacing:4,textTransform:"uppercase",color:"rgba(255,255,255,0.7)",marginBottom:4}}>Estimated Net Position</div>
            <div style={{fontSize:32,fontWeight:700,color:"#fff",letterSpacing:-1}}>{netPosition>=0?"+":""}{fmtShort(netPosition)}</div>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.6)",marginTop:2}}>Assets + Cash + Rental Income − Mortgage Debt − Loan Balances</div>
          </div>
          <div style={{fontSize:48,opacity:0.15}}>{netPosition>=0?"↑":"↓"}</div>
        </div>
      )}

      {/* Hint */}
      <div style={{fontSize:10,color:"#94A3B8",letterSpacing:1,textTransform:"uppercase",marginBottom:10,textAlign:"right"}}>⠿ drag to reorder</div>

      {/* Chart grid — draggable */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
        {chartOrder.map((id,i)=>{
          const card = chartContent[id];
          if(!card) return null;
          return (
            <div key={id} draggable
              onDragStart={e=>{setChartDrag(i);e.dataTransfer.effectAllowed="move";}}
              onDragOver={e=>{e.preventDefault();setChartOver(i);}}
              onDrop={e=>{e.preventDefault();if(chartDrag!==null&&chartDrag!==i){setChartOrder(o=>reorderArr(o,chartDrag,i));}setChartDrag(null);setChartOver(null);}}
              onDragEnd={()=>{setChartDrag(null);setChartOver(null);}}
              style={{opacity:chartDrag===i?0.4:1,transition:"opacity 0.15s,transform 0.15s",transform:chartOver===i&&chartDrag!==i?"scale(1.01)":"scale(1)",outline:chartOver===i&&chartDrag!==i?"2px solid #C9A84C":"none",outlineOffset:2,borderRadius:12,cursor:"grab"}}>
              <div style={{background:"#FFFFFF",borderRadius:12,padding:20,boxShadow:"0 1px 4px rgba(10,20,40,0.06),0 4px 20px rgba(10,20,40,0.07)",height:"100%",boxSizing:"border-box"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                  <div style={{fontSize:11,letterSpacing:2,color:card.accent,textTransform:"uppercase",fontWeight:600}}>{card.title}</div>
                  <span style={{color:"#9AA5B4",fontSize:14,cursor:"grab",userSelect:"none"}}>⠿</span>

          );
        })}
      </div>
    </div>
  );
}

function App() {
  const [data,setData]=useState(defaultData);
  const [tab,setTab]=useState("dashboard");
  const [modal,setModal]=useState(null);
  const [saving,setSaving]=useState(false);
  const saveTimeout=useRef(null);
  const loaded=useRef(false);

  useEffect(()=>{
    if(loaded.current) return;
    loaded.current=true;
    loadData().then(d=>{ if(d) setData(d); }).catch(()=>{});
  },[]);

  const persist=(newData)=>{
    setData(newData);
    if(saveTimeout.current) clearTimeout(saveTimeout.current);
    setSaving(true);
    saveTimeout.current=setTimeout(async()=>{ await saveData(newData); setSaving(false); },600);
  };

  const closeModal=()=>setModal(null);
  const saveLLC=async(item)=>{ setSaving(true); const obj={...item,id:item.id||uid()}; const list=modal.item?data.llcs.map(l=>l.id===obj.id?obj:l):[...data.llcs,obj]; persist({...data,llcs:list}); try{await window.__supabaseSave({table:'llcs',mapper:window.__tableMap.llcs[1],item:obj});}catch(e){showToast('⚠ Save failed');} setSaving(false); closeModal(); };
  const saveMortgage=async(item)=>{ setSaving(true); const obj={...item,id:item.id||uid()}; const list=modal.item?data.mortgages.map(m=>m.id===obj.id?obj:m):[...data.mortgages,obj]; persist({...data,mortgages:list}); try{await window.__supabaseSave({table:'mortgages',mapper:window.__tableMap.mortgages[1],item:obj});}catch(e){showToast('⚠ Save failed');} setSaving(false); closeModal(); };
  const saveLoan=async(item)=>{ setSaving(true); const obj={...item,id:item.id||uid()}; const list=modal.item?data.investments.map(i=>i.id===obj.id?obj:i):[...data.investments,obj]; persist({...data,investments:list}); try{await window.__supabaseSave({table:'loans',mapper:window.__tableMap.loans[1],item:obj});}catch(e){showToast('⚠ Save failed');} setSaving(false); closeModal(); };
  const saveInvestment=async(item)=>{ setSaving(true); const obj={...item,id:item.id||uid()}; const list=modal.item?data.investmentItems.map(i=>i.id===obj.id?obj:i):[...(data.investmentItems||[]),obj]; persist({...data,investmentItems:list}); try{await window.__supabaseSave({table:'investment_payback',mapper:window.__tableMap.investment[1],item:obj});}catch(e){showToast('⚠ Save failed');} setSaving(false); closeModal(); };
  const saveRental=async(item)=>{ setSaving(true); const obj={...item,id:item.id||uid()}; const list=modal.item?(data.rentalItems||[]).map(i=>i.id===obj.id?obj:i):[...(data.rentalItems||[]),obj]; persist({...data,rentalItems:list}); try{await window.__supabaseSave({table:'rental_income',mapper:window.__tableMap.rental[1],item:obj});}catch(e){showToast('⚠ Save failed');} setSaving(false); closeModal(); };
  const saveCompliance=async(item)=>{ setSaving(true); const obj={...item,id:item.id||uid()}; const list=modal.item?(data.complianceItems||[]).map(i=>i.id===obj.id?obj:i):[...(data.complianceItems||[]),obj]; persist({...data,complianceItems:list}); try{await window.__supabaseSave({table:'compliance_items',mapper:window.__tableMap.compliance[1],item:obj});}catch(e){showToast('⚠ Save failed');} setSaving(false); closeModal(); };
  const deleteItem=async(type,id)=>{
    const [table]=window.__tableMap[type]||[];
    if(table) await window.__supabaseDelete(table, id);
    if(type==="llcs") persist({...data,llcs:data.llcs.filter(l=>l.id!==id)});
    if(type==="mortgages") persist({...data,mortgages:data.mortgages.filter(m=>m.id!==id)});
    if(type==="loans") persist({...data,investments:data.investments.filter(i=>i.id!==id)});
    if(type==="investment") persist({...data,investmentItems:(data.investmentItems||[]).filter(i=>i.id!==id)});
    if(type==="rental") persist({...data,rentalItems:(data.rentalItems||[]).filter(i=>i.id!==id)});
    if(type==="compliance") persist({...data,complianceItems:(data.complianceItems||[]).filter(i=>i.id!==id)});
    showToast('Deleted');
  };
  const reorder=async(type,list)=>{
    const mapping=window.__tableMap[type];
    if(mapping) await window.__supabaseReorder(mapping[0], mapping[1], list);
    if(type==="llcs") persist({...data,llcs:list});
    if(type==="mortgages") persist({...data,mortgages:list});
    if(type==="loans") persist({...data,investments:list});
    if(type==="investment") persist({...data,investmentItems:list});
    if(type==="rental") persist({...data,rentalItems:list});
    if(type==="compliance") persist({...data,complianceItems:list});
  };

  const [llcSort,    setLlcSort]    = useState({key:"",dir:"asc"});
  const [mortSort,   setMortSort]   = useState({key:"",dir:"asc"});
  const [loanSort,   setLoanSort]   = useState({key:"",dir:"asc"});
  const [invSort,    setInvSort]    = useState({key:"",dir:"asc"});
  const [rentalSort, setRentalSort] = useState({key:"",dir:"asc"});
  const [perfOrder,   setPerfOrder]   = useState(null); // null = use pinned default

  const sortList = (list, key, dir) => {
    if (!key || key === "") return list;
    return [...list].sort((a,b)=>{
      let av=a[key], bv=b[key];
      if(!isNaN(Number(av))&&!isNaN(Number(bv))){ av=Number(av)||0; bv=Number(bv)||0; }
      else { av=String(av||"").toLowerCase(); bv=String(bv||"").toLowerCase(); }
      if(av<bv) return dir==="asc"?-1:1;
      if(av>bv) return dir==="asc"?1:-1;
      return 0;
    });
  };

  const totalAssets  = data.llcs.reduce((s,l)=>s+(Number(l.assets)||0),0);
  const totalRevenue = data.llcs.reduce((s,l)=>s+(Number(l.revYTD)||0),0);
  const totalCash    = data.llcs.reduce((s,l)=>s+(Number(l.cash)||0),0);
  const totalDebt    = data.mortgages.reduce((s,m)=>s+(Number(m.remaining)||0),0);
  const totalLoans   = data.investments.reduce((s,i)=>s+(Number(i.cost)||0),0);

  const assetData = data.llcs.filter(l=>l.assets).map(l=>({name:l.name?.split(" ").slice(0,2).join(" ")||"—",value:Number(l.assets)||0}));
  const loanData  = data.investments.filter(i=>i.value).map(i=>({name:i.name?.split(" ").slice(0,2).join(" ")||"—",value:Number(i.value)||0,cost:Number(i.cost)||0}));
  const mortData  = data.mortgages.filter(m=>m.original).map(m=>({name:m.property?.split(",")[0]?.slice(0,18)||"—",original:Number(m.original)||0,remaining:Number(m.remaining)||0}));

  const tabs=["dashboard","llcs","performance","mortgages","loans","investments","rental","compliance"];
  const tabLabels={dashboard:"Dashboard",llcs:"LLCs",performance:"Performance",mortgages:"Mortgages",loans:"Loans",investments:"Investment Payback",rental:"Rental Income",compliance:"Compliance"};

  return (
    <div style={{fontFamily:"Georgia,serif",background:"#F4F5F7",minHeight:"100vh",color:"#1A2332"}}>
      <div style={{background:"#1A2332",padding:"0 24px",display:"flex",alignItems:"center",justifyContent:"space-between",boxShadow:"0 2px 12px rgba(21,101,192,0.25)"}}>
        <div style={{display:"flex",alignItems:"center",gap:32}}>
          <div style={{padding:"14px 0"}}>
            <div style={{fontSize:10,letterSpacing:4,color:"#8A9BB0",textTransform:"uppercase"}}>Portfolio</div>
            <input value={data.ownerName} onChange={e=>{persist({...data,ownerName:e.target.value});window.__supabaseSave({__ownerName:e.target.value});}} placeholder="Owner Name"
              style={{background:"none",border:"none",color:"#FFFFFF",fontSize:16,fontWeight:700,fontFamily:"Georgia,serif",outline:"none",width:200,padding:0}}/>
          </div>

                          {r.status&&<span style={{background:r.status==="Active"?"#E8F0E8":r.status==="Vacant"?"#F5E8E8":"#EEF0F3",color:r.status==="Active"?"#1B5E20":r.status==="Vacant"?"#7B1A1A":"#475569",padding:"2px 10px",borderRadius:10,fontSize:11,fontWeight:600}}>{r.status}</span>}
                        </div>
                        <div style={{fontSize:12,color:"#6B7A8D",marginBottom:12}}>
                          {r.llc&&<span style={{marginRight:8}}>{r.llc}</span>}
                          {r.address&&<span>{r.address}</span>}
                        </div>
                        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:10,marginBottom:r.notes?10:0}}>
                          {r.monthlyRent&&<Stat label="Monthly Rent" value={fmt(r.monthlyRent)} accent/>}
                          {r.monthlyRent&&<Stat label="Annual Rent"  value={fmt(annual)}/>}
                          {r.sqft&&<Stat label="Sq Footage" value={`${Number(r.sqft).toLocaleString()} sq ft`}/>}
                          {r.sqft&&r.monthlyRent&&<Stat label="Rent / Sq Ft" value={`$${(Number(r.monthlyRent)/Number(r.sqft)).toFixed(2)}/sqft`}/>}
                          {r.vacancy!==undefined&&r.vacancy!==""&&<Stat label="Vacancy Rate" value={`${r.vacancy}%`}/>}
                          {r.monthlyRent&&<Stat label="Effective Income" value={fmt(effective)} color="#059669"/>}
                          {r.expenses&&<Stat label="Annual Expenses" value={fmt(r.expenses)}/>}
                          {r.monthlyRent&&<Stat label="NOI" value={`${noi>=0?"+":""}${fmt(noi)}`} color={noi>=0?"#059669":"#EF4444"}/>}
                          {r.tenantName&&<Stat label="Tenant" value={r.tenantName}/>}
                          {r.leaseEnd&&<Stat label="Lease Ends" value={r.leaseEnd}/>}
                        </div>
                        {r.notes&&<div style={{fontSize:11,color:"#E53935",fontStyle:"italic",marginTop:10}}>{r.notes}</div>}
                      </div>
                      <div style={{display:"flex",gap:8,marginLeft:12}}>
                        <ActionBtn label="Edit" onClick={()=>setModal({type:"rental",item:r})}/>
                        <ActionBtn label="Delete" danger onClick={()=>deleteItem("rental",r.id)}/>
                      </div>
                    </div>
                  </div>
                );
              }}/>
            }
          </div>
        )}

        {tab==="compliance" && (()=>{
          const items = data.complianceItems||[];
          const today = new Date();
          const daysUntil = d => { if(!d) return null; const dt=new Date(d); return Math.ceil((dt-today)/(1000*60*60*24)); };
          const urgency = d => { const n=daysUntil(d); if(n===null) return "gray"; if(n<0) return "red"; if(n<=30) return "red"; if(n<=90) return "amber"; return "green"; };
          const urgencyColor = {red:"#8B1A1A",amber:"#8B6914",green:"#1B5E20",gray:"#6B7A8D"};
          const urgencyBg = {red:"#F5E8E8",amber:"#FDF6E3",green:"#E8F0E8",gray:"#E8ECF0"};
          const sorted = [...items].sort((a,b)=>{
            const da=daysUntil(a.dueDate), db=daysUntil(b.dueDate);
            if(da===null&&db===null) return 0; if(da===null) return 1; if(db===null) return -1; return da-db;
          });
          const overdue = sorted.filter(i=>{ const n=daysUntil(i.dueDate); return n!==null&&n<0; });
          const soon    = sorted.filter(i=>{ const n=daysUntil(i.dueDate); return n!==null&&n>=0&&n<=90; });
          const upcoming= sorted.filter(i=>{ const n=daysUntil(i.dueDate); return n===null||n>90; });

          return (
            <div>
              <SectionHead title="Compliance & Renewal Calendar" onAdd={()=>setModal({type:"compliance",item:null})} addLabel="Add Item"/>
              {items.length===0?<Empty msg="No compliance items yet. Click '+ Add Item' to track deadlines."/>:(
                <div>
                  {overdue.length>0&&<div style={{marginBottom:20}}>
                    <div style={{fontSize:11,fontWeight:700,color:"#8B1A1A",letterSpacing:2,textTransform:"uppercase",marginBottom:10,display:"flex",alignItems:"center",gap:8}}><span>⚠</span> Overdue ({overdue.length})</div>
                    {overdue.map(item=>(<ComplianceCard key={item.id} item={item} daysUntil={daysUntil} urgencyColor={urgencyColor} urgencyBg={urgencyBg} onEdit={()=>setModal({type:"compliance",item})} onDelete={()=>deleteItem("compliance",item.id)}/>))}
                  </div>}
                  {soon.length>0&&<div style={{marginBottom:20}}>
                    <div style={{fontSize:11,fontWeight:700,color:"#8B6914",letterSpacing:2,textTransform:"uppercase",marginBottom:10}}>Due Within 90 Days ({soon.length})</div>
                    {soon.map(item=>(<ComplianceCard key={item.id} item={item} daysUntil={daysUntil} urgencyColor={urgencyColor} urgencyBg={urgencyBg} onEdit={()=>setModal({type:"compliance",item})} onDelete={()=>deleteItem("compliance",item.id)}/>))}
                  </div>}
                  {upcoming.length>0&&<div>
                    <div style={{fontSize:11,fontWeight:700,color:"#1B5E20",letterSpacing:2,textTransform:"uppercase",marginBottom:10}}>Upcoming ({upcoming.length})</div>
                    {upcoming.map(item=>(<ComplianceCard key={item.id} item={item} daysUntil={daysUntil} urgencyColor={urgencyColor} urgencyBg={urgencyBg} onEdit={()=>setModal({type:"compliance",item})} onDelete={()=>deleteItem("compliance",item.id)}/>))}
                  </div>}
                </div>
              )}
            </div>
          );
        })()}

        {tab==="performance" && (()=>{
          const today = new Date();
          const dayOfYear = Math.floor((today - new Date(today.getFullYear(),0,1))/(1000*60*60*24)) + 1;
          const totalRevYTD = data.llcs.reduce((s,l)=>s+(Number(l.revYTD)||0),0);
          const totalRevTarget = data.llcs.reduce((s,l)=>s+(Number(l.revTarget)||0),0);
          const totalNIYTD = data.llcs.reduce((s,l)=>s+(Number(l.netIncomeYTD)||0),0);
          const totalNITarget = data.llcs.reduce((s,l)=>s+(Number(l.netIncomeTarget)||0),0);
          const totalOHYTD   = data.llcs.reduce((s,l)=>s+(Number(l.overheadYTD)||0),0);
          const totalOHTarget= data.llcs.reduce((s,l)=>s+(Number(l.overheadTarget)||0),0);
          const pacedRevTotal = totalRevTarget>0?(totalRevTarget/365)*dayOfYear:0;
          const pacedNITotal  = totalNITarget>0?(totalNITarget/365)*dayOfYear:0;
          const pacedOHTotal  = totalOHTarget>0?(totalOHTarget/365)*dayOfYear:0;
          const revPctTotal   = totalRevTarget>0?Math.min((totalRevYTD/totalRevTarget)*100,100):0;
          const niPctTotal    = totalNITarget>0?Math.min((totalNIYTD/totalNITarget)*100,100):0;
          const ohPctTotal    = totalOHTarget>0?Math.min((totalOHYTD/totalOHTarget)*100,100):0;

          return (
            <div>
              <SectionHead title="Performance — 2026 YTD" />

              {/* Portfolio-level KPIs */}
              <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:24}}>
                <KPI label="Total YTD Revenue"    value={fmtShort(totalRevYTD)}   accent="#2E7D32" sub={`vs ${fmtShort(totalRevTarget)} target`}/>
                <KPI label="Total YTD Net Income" value={fmt(totalNIYTD)}    accent="#1E3A5F" sub={`vs ${fmt(totalNITarget)} target`}/>
                <KPI label="Revenue Paced" value={fmtShort(pacedRevTotal)} accent={totalRevYTD>=pacedRevTotal?"#C9A84C":"#8B1A1A"} sub={totalRevYTD>=pacedRevTotal?"✓ ahead of pace":"⚠ behind pace"}/>
                <KPI label="Net Income Paced" value={fmtShort(pacedNITotal)} accent={totalNIYTD>=pacedNITotal?"#C9A84C":"#8B1A1A"} sub={totalNIYTD>=pacedNITotal?"✓ ahead of pace":"⚠ behind pace"}/>
                <KPI label="Total YTD Overhead"  value={fmt(totalOHYTD)}    accent="#8B1A1A" sub={`vs ${fmt(totalOHTarget)} target`}/>
                <KPI label="Overhead Paced"       value={fmtShort(pacedOHTotal)} accent={totalOHYTD<=pacedOHTotal?"#C9A84C":"#8B1A1A"} sub={totalOHYTD<=pacedOHTotal?"✓ within pace":"⚠ over pace"}/>
              </div>

              {/* Per-LLC performance cards */}
              {data.llcs.length===0
                ? <Empty msg="No LLCs yet. Add LLCs and enter 2026 revenue and net income data."/>
                : <DraggableList
                    items={(()=>{ const PIN=["128 plumbing","american air"]; const pinned=PIN.flatMap(p=>data.llcs.filter(l=>(l.name||"").toLowerCase().includes(p.toLowerCase()))); const rest=data.llcs.filter(l=>!PIN.some(p=>(l.name||"").toLowerCase().includes(p.toLowerCase()))); return perfOrder?[...perfOrder.map(id=>data.llcs.find(l=>l.id===id)).filter(Boolean),...data.llcs.filter(l=>!perfOrder.includes(l.id))]:[...pinned,...rest]; })()}
                    onReorder={list=>setPerfOrder(list.map(l=>l.id))}
                    renderItem={llc=>{
                    const revYTD    = Number(llc.revYTD)||0;
                    const revTarget = Number(llc.revTarget)||0;
                    const pacedRev  = revTarget>0?(revTarget/365)*dayOfYear:0;
                    const revPct    = revTarget>0?Math.min((revYTD/revTarget)*100,100):0;
                    const revOver   = revTarget>0&&revYTD>=revTarget;
                    const niYTD     = Number(llc.netIncomeYTD)||0;
                    const niTarget  = Number(llc.netIncomeTarget)||0;
                    const pacedNI   = niTarget>0?(niTarget/365)*dayOfYear:0;
                    const niPct     = niTarget>0?Math.min((niYTD/niTarget)*100,100):0;
                    const niOver    = niTarget>0&&niYTD>=niTarget;
                    const ohYTD     = Number(llc.overheadYTD)||0;
                    const ohTarget  = Number(llc.overheadTarget)||0;
                    const pacedOH   = ohTarget>0?(ohTarget/365)*dayOfYear:0;
                    const ohPct     = ohTarget>0?Math.min((ohYTD/ohTarget)*100,100):0;
                    const ohUnder   = ohTarget>0&&ohYTD<=ohTarget;
                    const hasData   = revYTD||revTarget||niYTD||niTarget||ohYTD||ohTarget;
                    return (
                      <div key={llc.id} style={{background:"#FFFFFF",borderRadius:12,padding:"18px 20px",marginBottom:10,boxShadow:"0 2px 8px rgba(10,20,40,0.07)",borderLeft:`3px solid ${revOver&&niOver?"#1B5E20":revYTD>=pacedRev||niYTD>=pacedNI?"#C9A84C":"#1E3A5F"}`}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
                          <div>
                            <div style={{fontSize:15,fontWeight:700,color:"#1A2332"}}>{llc.name||"Unnamed LLC"}</div>
                            <div style={{fontSize:11,color:"#8A9BB0"}}>{llc.type}{llc.state?` · ${llc.state}`:""}</div>
                          </div>
                        </div>
                        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:10,marginBottom:14}}>
                          {[
                            {label:"YTD Revenue ($)",    field:"revYTD"},
                            {label:"Revenue Target ($)",  field:"revTarget"},
                            {label:"YTD Net Income ($)",  field:"netIncomeYTD"},
                            {label:"Net Income Target ($)",field:"netIncomeTarget"},
                            {label:"YTD Overhead ($)",      field:"overheadYTD"},
                            {label:"Overhead Target ($)",   field:"overheadTarget"},
                          ].map(({label,field})=>(
                            <div key={field}>
                              <div style={{fontSize:9,color:"#8A9BB0",fontWeight:600,letterSpacing:2,textTransform:"uppercase",marginBottom:4}}>{label}</div>
                              <input
                                type="text" inputMode="decimal"
                                value={formatCommas(llc[field]||"")}
                                onChange={e=>{
                                  const val = stripCommas(e.target.value.replace(/[^0-9.,\-]/g,""));
                                  const updated = {...llc,[field]:val};
                                  persist({...data,llcs:data.llcs.map(l=>l.id===llc.id?updated:l)});
                                }}
                                placeholder="0"
                                style={{width:"100%",padding:"8px 10px",border:"1.5px solid #D1D9E0",borderRadius:6,fontSize:13,fontWeight:700,color:"#1A2332",background:"#F7F8FA",outline:"none",fontFamily:"inherit",boxSizing:"border-box"}}
                              />
                            </div>
                          ))}
                        </div>

                        {(revYTD||revTarget)&&(
                          <div style={{marginBottom:12}}>
                            <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#8A9BB0",marginBottom:4}}>
                              <span style={{fontWeight:700,color:"#374151",letterSpacing:1,textTransform:"uppercase"}}>Revenue — YTD vs Target</span>
                              <span style={{color:revOver?"#1B5E20":"#374151",fontWeight:600}}>{fmt(revYTD)} / {fmt(revTarget)} ({revPct.toFixed(0)}%){revOver?" ✓ Exceeded":""}</span>
                            </div>
                            <div style={{background:"#E8ECF0",height:8,borderRadius:4,marginBottom:4}}>
                              <div style={{width:`${revPct}%`,height:"100%",background:revOver?"#1B5E20":"#1E3A5F",borderRadius:4,transition:"width 0.6s"}}/>
                            </div>
                            {revTarget>0&&<div style={{fontSize:10,color:"#8A9BB0"}}>
                              Expected by today: <strong style={{color:"#374151"}}>{fmt(pacedRev)}</strong> &mdash; YTD is <strong style={{color:revYTD>=pacedRev?"#1B5E20":"#8B1A1A"}}>{revYTD>=pacedRev?"+":""}{fmt(revYTD-pacedRev)}</strong> {revYTD>=pacedRev?"ahead of":"behind"} pace
                            </div>}
                          </div>
                        )}

                        {(niYTD||niTarget)&&(
                          <div>
                            <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#8A9BB0",marginBottom:4}}>
                              <span style={{fontWeight:700,color:"#374151",letterSpacing:1,textTransform:"uppercase"}}>Net Income — YTD vs Target</span>
                              <span style={{color:niOver?"#1B5E20":niYTD<0?"#8B1A1A":"#374151",fontWeight:600}}>{fmt(niYTD)} / {fmt(niTarget)} ({niPct.toFixed(0)}%){niOver?" ✓ Exceeded":""}</span>
                            </div>
                            <div style={{background:"#E8ECF0",height:8,borderRadius:4,marginBottom:4}}>
                              <div style={{width:`${niPct}%`,height:"100%",background:niOver?"#1B5E20":niYTD<0?"#8B1A1A":"#C9A84C",borderRadius:4,transition:"width 0.6s"}}/>
                            </div>
                            {niTarget>0&&<div style={{fontSize:10,color:"#8A9BB0"}}>
                              Expected by today: <strong style={{color:"#374151"}}>{fmt(pacedNI)}</strong> &mdash; YTD is <strong style={{color:niYTD>=pacedNI?"#1B5E20":"#8B1A1A"}}>{niYTD>=pacedNI?"+":""}{fmt(niYTD-pacedNI)}</strong> {niYTD>=pacedNI?"ahead of":"behind"} pace
                            </div>}
                          </div>
                        )}

                        {(ohYTD||ohTarget)&&(
                          <div style={{marginTop:10}}>
                            <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#8A9BB0",marginBottom:4}}>
                              <span style={{fontWeight:700,color:"#374151",letterSpacing:1,textTransform:"uppercase"}}>Overhead — YTD vs Target</span>
                              <span style={{color:ohUnder?"#1B5E20":ohYTD>ohTarget?"#8B1A1A":"#374151",fontWeight:600}}>{fmt(ohYTD)} / {fmt(ohTarget)} ({ohPct.toFixed(0)}%){ohUnder?" ✓ Within budget":ohYTD>ohTarget?" ⚠ Over budget":""}</span>
                            </div>
                            <div style={{background:"#E8ECF0",height:8,borderRadius:4,marginBottom:4}}>
                              <div style={{width:`${Math.min(ohPct,100)}%`,height:"100%",background:ohUnder?"#2E7D32":ohYTD>ohTarget?"#8B1A1A":"#C9A84C",borderRadius:4,transition:"width 0.6s"}}/>
                            </div>
                            {ohTarget>0&&<div style={{fontSize:10,color:"#8A9BB0"}}>
                              Expected by today: <strong style={{color:"#374151"}}>{fmt(pacedOH)}</strong> &mdash; YTD is <strong style={{color:ohYTD<=pacedOH?"#1B5E20":"#8B1A1A"}}>{ohYTD<=pacedOH?"":"+"}{fmt(ohYTD-pacedOH)}</strong> {ohYTD<=pacedOH?"under":"over"} pace
                            </div>}
                          </div>
                        )}
                      </div>
                    );
                  }}/>
              }
            </div>
          );
        })()}
      {modal?.type==="llc"      && <LLCModal      item={modal.item} onSave={saveLLC}      onClose={closeModal}/>}
      {modal?.type==="mortgage" && <MortgageModal  item={modal.item} onSave={saveMortgage} onClose={closeModal} llcs={data.llcs}/>}
      {modal?.type==="loan"     && <LoanModal      item={modal.item} onSave={saveLoan}     onClose={closeModal} llcs={data.llcs}/>}
      {modal?.type==="investment" && <InvestmentModal item={modal.item} onSave={saveInvestment} onClose={closeModal} llcs={data.llcs}/>}
      {modal?.type==="rental" && <RentalModal item={modal.item} onSave={saveRental} onClose={closeModal} llcs={data.llcs}/>}
      {modal?.type==="compliance" && <ComplianceModal item={modal.item} onSave={saveCompliance} onClose={closeModal} llcs={data.llcs}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
