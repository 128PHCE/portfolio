<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Business Portfolio Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;background:#F4F5F7;color:#1A2332;min-height:100vh}
nav{background:#1A2332;padding:0 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,0.18)}
.nav-left{display:flex;align-items:center;gap:0}
.nav-brand{padding:14px 20px 14px 0;border-right:1px solid rgba(255,255,255,0.1);margin-right:20px}
.nav-label{font-size:9px;letter-spacing:4px;color:#8A9BB0;text-transform:uppercase}
.nav-owner{font-size:15px;font-weight:700;color:#fff;background:none;border:none;outline:none;font-family:Georgia,serif;padding:0;cursor:text}
.nav-tabs{display:flex;overflow-x:auto}
.nav-tab{background:none;border:none;border-bottom:2px solid transparent;color:rgba(160,174,192,0.75);cursor:pointer;font-family:Georgia,serif;font-size:11px;letter-spacing:1.5px;padding:16px 14px;text-transform:uppercase;white-space:nowrap;transition:all 0.15s}
.nav-tab.active{color:#fff;border-bottom-color:#C9A84C}
.nav-status{font-size:10px;color:#64748B;white-space:nowrap}
.container{max-width:1140px;margin:0 auto;padding:24px 20px 60px}
.tab{display:none}.tab.active{display:block}
/* KPI */
.kpi-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.kpi{background:#fff;border-radius:12px;padding:18px 20px;flex:1;min-width:130px;box-shadow:0 2px 12px rgba(0,0,0,0.07)}
.kpi.small{flex:0 0 auto;min-width:110px;padding:12px 16px}
.kpi-label{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#8A9BB0;font-weight:600;margin-bottom:7px}
.kpi-value{font-size:22px;font-weight:700;color:#1A2332;letter-spacing:-0.5px}
.kpi.small .kpi-value{font-size:15px}
.kpi-sub{font-size:10px;color:#8A9BB0;margin-top:3px}
/* Net banner */
.net-banner{border-radius:12px;padding:20px 28px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
.net-banner .net-label{font-size:9px;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,0.6);margin-bottom:4px}
.net-banner .net-value{font-size:28px;font-weight:700;color:#fff;letter-spacing:-1px}
.net-banner .net-sub{font-size:10px;color:rgba(255,255,255,0.5);margin-top:2px}
.net-arrow{font-size:40px;opacity:0.12;color:#fff}
/* Charts */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.chart-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,0.07)}
.chart-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:600;color:#6B7A8D;margin-bottom:14px}
.chart-wrap{position:relative;height:200px}
/* Cards */
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section-head h2{font-size:16px;font-weight:700;color:#1A2332}
.add-btn{background:#1E3A5F;color:#fff;border:none;border-radius:6px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:Georgia,serif}
.sort-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.sort-label{font-size:10px;color:#8A9BB0;letter-spacing:2px;text-transform:uppercase;font-weight:600}
.sort-btn{background:#E8ECF0;color:#1E3A5F;border:none;border-radius:20px;padding:4px 12px;font-size:11px;font-weight:600;cursor:pointer}
.sort-btn.active{background:#1E3A5F;color:#fff}
.clear-btn{background:none;color:#8B1A1A;border:1px solid #DDB8B8;border-radius:20px;padding:4px 12px;font-size:11px;font-weight:600;cursor:pointer}
.card-list{display:flex;flex-direction:column;gap:10px}
.card{background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 2px 8px rgba(0,0,0,0.07);border-left:3px solid #1E3A5F}
.card.gold{border-left-color:#C9A84C}
.card.green{border-left-color:#2E7D32}
.card.red{border-left-color:#8B1A1A}
.card-name{font-size:15px;font-weight:700;color:#1A2332;margin-bottom:4px}
.card-meta{font-size:12px;color:#6B7A8D;margin-bottom:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;background:#E8ECF0;color:#1E3A5F}
.badge.green{background:#E8F0E8;color:#1B5E20}
.badge.red{background:#F5E8E8;color:#7B1A1A}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:8px}
.stat{background:#F7F8FA;border:1px solid #D6DDE8;border-radius:8px;padding:8px 12px}
.stat-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#8A9BB0;font-weight:600;margin-bottom:2px}
.stat-value{font-size:13px;font-weight:700;color:#1A2332}
.stat-value.accent{color:#1E3A5F}
.stat-value.green{color:#1B5E20}
.stat-value.red{color:#8B1A1A}
.card-actions{display:flex;gap:8px;margin-left:12px;flex-shrink:0}
.edit-btn{background:#E8ECF0;color:#1E3A5F;border:none;border-radius:6px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer}
.del-btn{background:none;color:#8A9BB0;border:none;border-radius:6px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer}
.edit-btn:hover{background:#C9D5E0}
.del-btn:hover{background:#FEF2F2;color:#8B1A1A}
.progress-wrap{margin-top:10px}
.progress-label{display:flex;justify-content:space-between;font-size:10px;color:#8A9BB0;margin-bottom:4px}
.progress-bar{background:#E2E8F0;height:7px;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:#1E3A5F;border-radius:4px;transition:width 0.6s}
.progress-fill.green{background:#2E7D32}
.progress-fill.gold{background:#C9A84C}
.progress-fill.red-fill{background:#8B1A1A}
.progress-note{font-size:10px;color:#8A9BB0;margin-top:3px}
.hist-row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.hist-tile{background:#F7F8FA;border:1px solid #E2E8F0;border-radius:6px;padding:6px 12px;text-align:center}
.hist-year{font-size:8px;color:#8A9BB0;font-weight:600;letter-spacing:1px}
.hist-val{font-size:12px;font-weight:700;color:#1A2332}
.hist-val.pos{color:#1B5E20}.hist-val.neg{color:#8B1A1A}.hist-val.ytd{color:#1E3A5F}
.note{font-size:11px;color:#E53935;font-style:italic;margin-top:8px}
.empty{text-align:center;padding:28px;color:#8A9BB0;font-size:13px;border:1.5px dashed #CBD5E1;border-radius:8px;background:#FAFCFF}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:12px;box-shadow:0 24px 64px rgba(0,0,0,0.2);width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 16px;border-bottom:1px solid #DDE3EA}
.modal-title{font-size:17px;font-weight:700;color:#1A2332}
.modal-close{background:none;border:none;font-size:22px;color:#94A3B8;cursor:pointer;line-height:1}
.modal-body{padding:20px 24px 24px}
.field{margin-bottom:14px}
.field.half{width:calc(50% - 6px)}
.field-row{display:flex;gap:12px;flex-wrap:wrap}
.field label{display:block;font-size:11px;font-weight:600;color:#374151;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}
.field input,.field select{width:100%;padding:9px 12px;border:1.5px solid #D1D9E0;border-radius:6px;font-size:13px;color:#1A2332;background:#F7F8FA;outline:none;font-family:Georgia,serif}
.field input.with-prefix{padding-left:22px}
.field .prefix{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#8A9BB0;font-size:13px;pointer-events:none}
.field .input-wrap{position:relative}
.save-btn{background:#1E3A5F;color:#fff;border:none;border-radius:7px;padding:10px 24px;font-size:13px;font-weight:700;cursor:pointer;width:100%;margin-top:4px;font-family:Georgia,serif}
.section-box{background:#F7F8FA;border:1px solid #E2E8F0;border-radius:8px;padding:14px 14px 2px;margin-bottom:14px}
.section-box-title{font-size:10px;font-weight:700;color:#374151;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
.section-box hr{border:none;border-top:1px solid #E2E8F0;margin:10px 0}
/* Compliance */
.comp-card{background:#fff;border-radius:12px;padding:14px 18px;box-shadow:0 2px 8px rgba(0,0,0,0.07);border-left:3px solid #1E3A5F;margin-bottom:8px}
.urgency-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;margin-top:8px}
/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:#1A2332;color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.2);animation:fi 0.3s ease}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* Spinner */
.spinner{display:inline-block;width:28px;height:28px;border:3px solid #E2E8F0;border-top-color:#1E3A5F;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){.chart-grid{grid-template-columns:1fr}.kpi{min-width:calc(50% - 6px)}.nav-tab{font-size:10px;padding:14px 10px}}
</style>
</head>
<body>

<!-- Loading screen -->
<div id="loading-screen" style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px">
  <div class="spinner"></div>
  <div style="color:#8A9BB0;font-size:14px">Connecting to database…</div>
</div>

<!-- Main app (hidden until loaded) -->
<div id="app" style="display:none">
  <nav>
    <div class="nav-left">
      <div class="nav-brand">
        <div class="nav-label">Portfolio</div>
        <input class="nav-owner" id="owner-name" placeholder="Owner Name" maxlength="50"/>
      </div>
      <div class="nav-tabs" id="nav-tabs"></div>
    </div>
    <div class="nav-status" id="nav-status">✓ Live</div>
  </nav>
  <div class="container" id="tab-content"></div>
</div>

<div id="modal-container"></div>

<script>
// ── Config ────────────────────────────────────────────────────
const SUPA_URL = 'https://usrfedppjghiiayoewil.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzcmZlZHBwamdoaWlheW9ld2lsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczOTI3NTksImV4cCI6MjA5Mjk2ODc1OX0.z5znEmv_Y0I1uZ6X4PtIob_ZDU2rwjjT_8AKcYgZOX8';

// ── State ─────────────────────────────────────────────────────
let state = {
  ownerName:'', llcs:[], mortgages:[], investments:[],
  investmentItems:[], rentalItems:[], complianceItems:[]
};
let currentTab = 'dashboard';
const tabs = ['dashboard','llcs','performance','mortgages','loans','investments','rental','compliance'];
const tabLabels = {dashboard:'Dashboard',llcs:'LLCs',performance:'Performance',mortgages:'Mortgages',loans:'Loans',investments:'Investment Payback',rental:'Rental Income',compliance:'Compliance'};

// ── Helpers ───────────────────────────────────────────────────
const uid = () => Math.random().toString(36).slice(2,9);
const fmt = n => { if(!n&&n!==0) return '—'; return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number(n)); };
const fmtS = n => { const v=Number(n)||0; if(v>=1e6) return '$'+(v/1e6).toFixed(1)+'M'; if(v>=1e3) return '$'+(v/1e3).toFixed(0)+'K'; return '$'+v; };
const fmtCommas = s => { if(!s&&s!==0) return ''; const n=parseFloat(String(s).replace(/,/g,'')); if(isNaN(n)) return s; return n.toLocaleString('en-US'); };
const stripC = s => String(s||'').replace(/,/g,'');
const el = id => document.getElementById(id);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function showToast(msg, dur=2500) {
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),dur);
}

function setStatus(s) { const e=el('nav-status'); if(e) e.textContent=s; }

// ── Supabase API ──────────────────────────────────────────────
const hdrs = () => ({'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=representation'});

async function sbGet(table, qs='') {
  const r = await fetch(SUPA_URL+'/rest/v1/'+table+'?select=*'+(qs?'&'+qs:''), {method:'GET',headers:hdrs()});
  if(!r.ok) throw new Error('GET '+table+' failed: '+r.status);
  return r.json();
}
async function sbUpsert(table, row) {
  const r = await fetch(SUPA_URL+'/rest/v1/'+table, {method:'POST',headers:{...hdrs(),'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(row)});
  if(!r.ok) { const t=await r.text(); throw new Error(t); }
  return r.json();
}
async function sbDelete(table, id) {
  await fetch(SUPA_URL+'/rest/v1/'+table+'?id=eq.'+id, {method:'DELETE',headers:hdrs()});
}
async function sbPatch(table, data, qs) {
  await fetch(SUPA_URL+'/rest/v1/'+table+'?'+qs, {method:'PATCH',headers:hdrs(),body:JSON.stringify(data)});
}

// ── DB Mappers ────────────────────────────────────────────────
const toLLC = l => ({id:l.id,name:l.name,type:l.type,state:l.state,formed:l.formed,status:l.status,revenue:l.revenue,revenue_target:l.revenueTarget,assets:l.assets,cash:l.cash,members:l.members,tax_id:l.taxId,rev2023:l.rev2023,rev2024:l.rev2024,rev2025:l.rev2025,rev_ytd:l.revYTD,rev_target:l.revTarget,ni2023:l.ni2023,ni2024:l.ni2024,ni2025:l.ni2025,net_income:l.netIncome,net_income_target:l.netIncomeTarget,net_income_ytd:l.netIncomeYTD,overhead_ytd:l.overheadYTD,overhead_target:l.overheadTarget,primary_owner:l.primaryOwner,primary_pct:l.primaryPct,secondary_owner:l.secondaryOwner,secondary_pct:l.secondaryPct,notes:l.notes,sort_order:l.sort_order||0});
const fromLLC = r => ({id:r.id,name:r.name,type:r.type,state:r.state,formed:r.formed,status:r.status,revenue:r.revenue,revenueTarget:r.revenue_target,assets:r.assets,cash:r.cash,members:r.members,taxId:r.tax_id,rev2023:r.rev2023,rev2024:r.rev2024,rev2025:r.rev2025,revYTD:r.rev_ytd,revTarget:r.rev_target,ni2023:r.ni2023,ni2024:r.ni2024,ni2025:r.ni2025,netIncome:r.net_income,netIncomeTarget:r.net_income_target,netIncomeYTD:r.net_income_ytd,overheadYTD:r.overhead_ytd,overheadTarget:r.overhead_target,primaryOwner:r.primary_owner,primaryPct:r.primary_pct,secondaryOwner:r.secondary_owner,secondaryPct:r.secondary_pct,notes:r.notes,sort_order:r.sort_order});
const toMort = m => ({id:m.id,property:m.property,llc:m.llc,original:m.original,remaining:m.remaining,rate:m.rate,monthly:m.monthly,term:m.term,maturity:m.maturity,lender:m.lender,notes:m.notes,sort_order:m.sort_order||0});
const fromMort = r => ({id:r.id,property:r.property,llc:r.llc,original:r.original,remaining:r.remaining,rate:r.rate,monthly:r.monthly,term:r.term,maturity:r.maturity,lender:r.lender,notes:r.notes,sort_order:r.sort_order});
const toLoan = l => ({id:l.id,name:l.name,llc:l.llc,type:l.type,value:l.value,cost:l.cost,notes:l.notes,sort_order:l.sort_order||0});
const fromLoan = r => ({id:r.id,name:r.name,llc:r.llc,type:r.type,value:r.value,cost:r.cost,notes:r.notes,sort_order:r.sort_order});
const toInv = i => ({id:i.id,name:i.name,llc:i.llc,type:i.type,value:i.value,cost:i.cost,notes:i.notes,sort_order:i.sort_order||0});
const fromInv = r => ({id:r.id,name:r.name,llc:r.llc,type:r.type,value:r.value,cost:r.cost,notes:r.notes,sort_order:r.sort_order});
const toRent = r => ({id:r.id,name:r.name,address:r.address,llc:r.llc,status:r.status,sqft:r.sqft,monthly_rent:r.monthlyRent,vacancy:r.vacancy,expenses:r.expenses,tenant_name:r.tenantName,lease_end:r.leaseEnd,notes:r.notes,sort_order:r.sort_order||0});
const fromRent = r => ({id:r.id,name:r.name,address:r.address,llc:r.llc,status:r.status,sqft:r.sqft,monthlyRent:r.monthly_rent,vacancy:r.vacancy,expenses:r.expenses,tenantName:r.tenant_name,leaseEnd:r.lease_end,notes:r.notes,sort_order:r.sort_order});
const toComp = c => ({id:c.id,name:c.name,category:c.category,llc:c.llc,due_date:c.dueDate,recurring:c.recurring,notes:c.notes,sort_order:c.sort_order||0});
const fromComp = r => ({id:r.id,name:r.name,category:r.category,llc:r.llc,dueDate:r.due_date,recurring:r.recurring,notes:r.notes,sort_order:r.sort_order});

const tableMap = {
  llcs: ['llcs', toLLC],
  mortgages: ['mortgages', toMort],
  loans: ['loans', toLoan],
  investment: ['investment_payback', toInv],
  rental: ['rental_income', toRent],
  compliance: ['compliance_items', toComp]
};

// ── Load all data ─────────────────────────────────────────────
async function loadAll() {
  const [settings,llcs,morts,loans,inv,rent,comp] = await Promise.all([
    sbGet('portfolio_settings'),
    sbGet('llcs','order=sort_order.asc'),
    sbGet('mortgages','order=sort_order.asc'),
    sbGet('loans','order=sort_order.asc'),
    sbGet('investment_payback','order=sort_order.asc'),
    sbGet('rental_income','order=sort_order.asc'),
    sbGet('compliance_items','order=sort_order.asc'),
  ]);
  state.ownerName = settings[0]?.owner_name||'';
  state.llcs = llcs.map(fromLLC);
  state.mortgages = morts.map(fromMort);
  state.investments = loans.map(fromLoan);
  state.investmentItems = inv.map(fromInv);
  state.rentalItems = rent.map(fromRent);
  state.complianceItems = comp.map(fromComp);
}

// ── Save helpers ──────────────────────────────────────────────
async function saveItem(type, item) {
  setStatus('⟳ Saving…');
  try {
    const [table, mapper] = tableMap[type];
    await sbUpsert(table, mapper(item));
    setStatus('✓ Live');
    showToast('✓ Saved');
  } catch(e) { setStatus('⚠ Error'); showToast('⚠ Save failed: '+e.message, 4000); }
}
async function deleteItem(type, id) {
  const [table] = tableMap[type];
  await sbDelete(table, id);
  showToast('Deleted');
}
async function reorderItems(type, list) {
  const [table, mapper] = tableMap[type];
  await Promise.all(list.map((item,i) => sbUpsert(table, mapper({...item, sort_order:i}))));
}

// ── TOTALS ────────────────────────────────────────────────────
function totals() {
  const today = new Date();
  const start = new Date(today.getFullYear(),0,1);
  const dayOfYear = Math.floor((today-start)/(864e5))+1;
  const totalAssets = state.llcs.reduce((s,l)=>s+(+l.assets||0),0);
  const totalRevYTD = state.llcs.reduce((s,l)=>s+(+l.revYTD||0),0);
  const totalCash = state.llcs.reduce((s,l)=>s+(+l.cash||0),0);
  const totalDebt = state.mortgages.reduce((s,m)=>s+(+m.remaining||0),0);
  const totalLoans = state.investments.reduce((s,i)=>s+(+i.cost||0),0);
  const rentalIncome = state.rentalItems.reduce((s,r)=>s+(+r.monthlyRent||0)*12*(1-(+r.vacancy||0)/100),0);
  const netPos = totalAssets+totalCash+rentalIncome-totalDebt-totalLoans;
  const today90=new Date(); today90.setDate(today90.getDate()+90);
  const compAlert = state.complianceItems.filter(i=>{if(!i.dueDate)return false;return new Date(i.dueDate)<=today90;}).length;
  return {totalAssets,totalRevYTD,totalCash,totalDebt,totalLoans,rentalIncome,netPos,compAlert,dayOfYear};
}

// ── RENDER ENGINE ─────────────────────────────────────────────
const charts = {};
function destroyCharts() { Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}}) ; Object.keys(charts).forEach(k=>delete charts[k]); }

function kpiHTML(label, value, accent, sub, small=false) {
  return `<div class="kpi${small?' small':''}" style="border-top:3px solid ${accent}">
    <div class="kpi-label">${label}</div>
    <div class="kpi-value">${value}</div>
    ${sub?`<div class="kpi-sub">${sub}</div>`:''}
  </div>`;
}

function statHTML(label, value, cls='') {
  return `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value ${cls}">${value}</div></div>`;
}

function progressHTML(label, val, target, fillCls='', note='') {
  const pct = target>0 ? Math.min((val/target)*100,100) : 0;
  return `<div class="progress-wrap">
    <div class="progress-label"><span style="font-weight:700;color:#374151;letter-spacing:1px;text-transform:uppercase;font-size:10px">${label}</span>
    <span style="font-weight:600;color:${val>=target&&target>0?'#1B5E20':'#374151'}">${fmt(val)} / ${fmt(target)} (${pct.toFixed(0)}%)${val>=target&&target>0?' ✓':''}</span></div>
    <div class="progress-bar"><div class="progress-fill ${fillCls}" style="width:${pct}%"></div></div>
    ${note?`<div class="progress-note">${note}</div>`:''}
  </div>`;
}

function llcSelectHTML(val='') {
  const opts = state.llcs.map(l=>`<option value="${esc(l.name)}" ${l.name===val?'selected':''}>${esc(l.name)}</option>`).join('');

}

// ── PERFORMANCE TAB ───────────────────────────────────────────
function renderPerformance() {
  const today = new Date();
  const dayOfYear = Math.floor((today-new Date(today.getFullYear(),0,1))/864e5)+1;
  const tRevYTD = state.llcs.reduce((s,l)=>s+(+l.revYTD||0),0);
  const tRevTgt = state.llcs.reduce((s,l)=>s+(+l.revTarget||0),0);

  const tNITgt  = state.llcs.reduce((s,l)=>s+(+l.netIncomeTarget||0),0);
  const tOHYTD  = state.llcs.reduce((s,l)=>s+(+l.overheadYTD||0),0);
  const tOHTgt  = state.llcs.reduce((s,l)=>s+(+l.overheadTarget||0),0);
  const pRevTot = tRevTgt>0?(tRevTgt/365)*dayOfYear:0;
  const pNITot  = tNITgt>0?(tNITgt/365)*dayOfYear:0;
  const pOHTot  = tOHTgt>0?(tOHTgt/365)*dayOfYear:0;

  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2>Performance — 2026 YTD</h2></div>`;
  html += `<div class="kpi-row">
    ${kpiHTML('Total YTD Revenue', fmtS(tRevYTD), '#2E7D32', 'vs '+fmtS(tRevTgt)+' target')}
    ${kpiHTML('Total YTD Net Income', fmt(tNIYTD), '#1E3A5F', 'vs '+fmt(tNITgt)+' target')}
    ${kpiHTML('Revenue Paced', fmtS(pRevTot), tRevYTD>=pRevTot?'#C9A84C':'#8B1A1A', tRevYTD>=pRevTot?'✓ ahead of pace':'⚠ behind pace')}
    ${kpiHTML('Net Income Paced', fmtS(pNITot), tNIYTD>=pNITot?'#C9A84C':'#8B1A1A', tNIYTD>=pNITot?'✓ ahead of pace':'⚠ behind pace')}
    ${kpiHTML('Total YTD Overhead', fmt(tOHYTD), '#8B1A1A', 'vs '+fmt(tOHTgt)+' target', true)}
    ${kpiHTML('Overhead Paced', fmtS(pOHTot), tOHYTD<=pOHTot?'#C9A84C':'#8B1A1A', tOHYTD<=pOHTot?'✓ within pace':'⚠ over pace', true)}
  </div>`;

  const PIN = ['128 plumbing','american air'];
  const pinned = PIN.flatMap(p=>state.llcs.filter(l=>(l.name||'').toLowerCase().includes(p)));
  const rest = state.llcs.filter(l=>!PIN.some(p=>(l.name||'').toLowerCase().includes(p)));
  const ordered = [...pinned,...rest];

  html += `<div class="card-list" id="perf-list">`;
  ordered.forEach(l=>{
    const revYTD=+l.revYTD||0, revTgt=+l.revTarget||0, pRev=revTgt>0?(revTgt/365)*dayOfYear:0;
    const revPct=revTgt>0?Math.min((revYTD/revTgt)*100,100):0;
    const niYTD=+l.netIncomeYTD||0, niTgt=+l.netIncomeTarget||0, pNI=niTgt>0?(niTgt/365)*dayOfYear:0;
    const niPct=niTgt>0?Math.min((niYTD/niTgt)*100,100):0;
    const ohYTD=+l.overheadYTD||0, ohTgt=+l.overheadTarget||0, pOH=ohTgt>0?(ohTgt/365)*dayOfYear:0;
    const ohPct=ohTgt>0?Math.min((ohYTD/ohTgt)*100,100):0;
    const border = (revYTD>=revTgt&&revTgt>0)&&(niYTD>=niTgt&&niTgt>0)?'#1B5E20':revYTD>=pRev||niYTD>=pNI?'#C9A84C':'#1E3A5F';

    html+=`<div class="card" style="border-left-color:${border}">
      <div class="card-name">${esc(l.name||'Unnamed LLC')}</div>
      <div class="card-meta">${l.type?esc(l.type):''}${l.state?'· '+esc(l.state):''}</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr) repeat(3,1fr);gap:10px;margin-bottom:14px">
        ${['revYTD','revTarget','netIncomeYTD','netIncomeTarget','overheadYTD','overheadTarget'].map(field=>{
          const labels={revYTD:'YTD Revenue ($)',revTarget:'Revenue Target ($)',netIncomeYTD:'YTD Net Income ($)',netIncomeTarget:'Net Income Target ($)',overheadYTD:'YTD Overhead ($)',overheadTarget:'Overhead Target ($)'};
          return `<div>
            <div style="font-size:9px;color:#8A9BB0;font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px">${labels[field]}</div>
            <input type="text" inputmode="decimal" value="${fmtCommas(l[field]||'')}" placeholder="0"
              style="width:100%;padding:8px 10px;border:1.5px solid #D1D9E0;border-radius:6px;font-size:13px;font-weight:700;color:#1A2332;background:#F7F8FA;outline:none;font-family:Georgia,serif;box-sizing:border-box"
              onchange="updateLLCField('${l.id}','${field}',this.value)"
              oninput="this.value=this.value.replace(/[^0-9.,\-]/g,'')"/>
          </div>`;
        }).join('')}
      </div>
      ${(revYTD||revTgt)?progressHTML('Revenue — YTD vs Target',revYTD,revTgt,revYTD>=revTgt?'green':'',revTgt>0?'Expected by today: '+fmt(pRev)+' — YTD is <strong style="color:'+(revYTD>=pRev?'#1B5E20':'#8B1A1A')+'">'+(revYTD>=pRev?'+':'')+fmt(revYTD-pRev)+'</strong> '+(revYTD>=pRev?'ahead of':'behind')+' pace':''):''}
      ${(niYTD||niTgt)?progressHTML('Net Income — YTD vs Target',niYTD,niTgt,niYTD>=niTgt?'green':'gold',niTgt>0?'Expected by today: '+fmt(pNI)+' — YTD is <strong style="color:'+(niYTD>=pNI?'#1B5E20':'#8B1A1A')+'">'+(niYTD>=pNI?'+':'')+fmt(niYTD-pNI)+'</strong> '+(niYTD>=pNI?'ahead of':'behind')+' pace':''):''}
      ${(ohYTD||ohTgt)?progressHTML('Overhead — YTD vs Target',ohYTD,ohTgt,ohYTD<=ohTgt?'green':ohYTD>ohTgt?'red-fill':'gold',ohTgt>0?'Expected by today: '+fmt(pOH)+' — YTD is <strong style="color:'+(ohYTD<=pOH?'#1B5E20':'#8B1A1A')+'">'+(ohYTD<=pOH?'':'')+fmt(ohYTD-pOH)+'</strong> '+(ohYTD<=pOH?'under':'over')+' pace':''):''}
    </div>`;
  });
  html+=`</div>`;
  el('tab-content').innerHTML = html;
}

async function updateLLCField(id, field, rawVal) {
  const val = stripC(rawVal);
  const llc = state.llcs.find(l=>l.id===id);
  if(!llc) return;
  llc[field] = val;
  try {
    await sbUpsert('llcs', toLLC(llc));
    setStatus('✓ Live');
  } catch(e) { setStatus('⚠ Error'); }
}

  let html = `<div class="section-head"><h2>Loans</h2><button class="add-btn" onclick="openModal('loan',null)">+ Add Loan</button></div>`;
  if(!state.investments.length) { html+=`<div class="empty">No loans yet.</div>`; }
  else {
    html+=`<div class="card-list">`;
    state.investments.forEach(l=>{
      const amt=+l.value||0,bal=+l.cost||0,paid=amt>0?((amt-bal)/amt*100):0;
      html+=`<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div style="flex:1">
            <div class="card-name">${esc(l.name||'Unnamed Loan')}</div>
            <div class="card-meta">${l.type?`<span class="badge">${esc(l.type)}</span>`:''} ${l.llc?esc(l.llc):''}</div>
            <div class="stats-grid">
              ${l.value?statHTML('Loan Amount',fmt(l.value),'accent'):''}
              ${l.cost?statHTML('Balance Owed',fmt(l.cost)):''}
              ${amt&&bal?statHTML('Paid Off',paid.toFixed(1)+'%'):''}
            </div>
            ${amt&&bal?`<div class="progress-wrap"><div class="progress-label"><span>Payoff progress</span><span>${paid.toFixed(1)}%</span></div><div class="progress-bar"><div class="progress-fill" style="width:${Math.min(paid,100)}%"></div></div></div>`:''}
            ${l.notes?`<div class="note">${esc(l.notes)}</div>`:''}
          </div>
          <div class="card-actions">
            <button class="edit-btn" onclick="openModal('loan','${l.id}')">Edit</button>
            <button class="del-btn" onclick="doDelete('loans','${l.id}')">Delete</button>
          </div>
        </div>
      </div>`;
    });
    html+=`</div>`;
  }
  el('tab-content').innerHTML = html;
}

// ── COMPLIANCE TAB ────────────────────────────────────────────
function renderCompliance() {
  const today = new Date();
  const daysUntil = d => { if(!d) return null; return Math.ceil((new Date(d)-today)/864e5); };
  const urgency = d => { const n=daysUntil(d); if(n===null) return 'gray'; if(n<0) return 'red'; if(n<=90) return 'amber'; return 'green'; };
  const urgCols = {red:'#8B1A1A',amber:'#8B6914',green:'#1B5E20',gray:'#6B7A8D'};
  const urgBgs  = {red:'#F5E8E8',amber:'#FDF6E3',green:'#E8F0E8',gray:'#E8ECF0'};

  let html = `<div class="section-head"><h2>Compliance & Renewal Calendar</h2><button class="add-btn" onclick="openModal('compliance',null)">+ Add Item</button></div>`;
  if(!state.complianceItems.length) { html+=`<div class="empty">No compliance items yet.</div>`; el('tab-content').innerHTML=html; return; }

  const sorted = [...state.complianceItems].sort((a,b)=>{const da=daysUntil(a.dueDate),db=daysUntil(b.dueDate);if(da===null&&db===null)return 0;if(da===null)return 1;if(db===null)return-1;return da-db;});
  const overdue  = sorted.filter(i=>{const n=daysUntil(i.dueDate);return n!==null&&n<0;});
  const soon     = sorted.filter(i=>{const n=daysUntil(i.dueDate);return n!==null&&n>=0&&n<=90;});
  const upcoming = sorted.filter(i=>{const n=daysUntil(i.dueDate);return n===null||n>90;});

  const compCard = (i) => {
    const n=daysUntil(i.dueDate), u=urgency(i.dueDate);
    const label=n===null?'No date':n<0?Math.abs(n)+'d overdue':n===0?'Due today':n+'d remaining';
    return `<div class="comp-card" style="border-left-color:${urgCols[u]}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
            <div style="font-size:14px;font-weight:700;color:#1A2332">${esc(i.name||'Unnamed')}</div>
            ${i.category?`<span class="badge">${esc(i.category)}</span>`:''}
          </div>
          <div style="font-size:12px;color:#6B7A8D;margin-bottom:8px">${i.llc?esc(i.llc):''}${i.dueDate?' · Due: <strong>'+esc(i.dueDate)+'</strong>':''}${i.recurring?' · ↻ '+esc(i.recurring):''}</div>
          <span class="urgency-badge" style="background:${urgBgs[u]};color:${urgCols[u]}">${n!==null&&n<0?'⚠':n!==null&&n<=30?'!':'●'} ${label}</span>
          ${i.notes?`<div class="note">${esc(i.notes)}</div>`:''}
        </div>
        <div class="card-actions">
          <button class="edit-btn" onclick="openModal('compliance','${i.id}')">Edit</button>
          <button class="del-btn" onclick="doDelete('compliance','${i.id}')">Delete</button>
        </div>
      </div>
    </div>`;
  };

  if(overdue.length)  html+=`<div style="font-size:11px;font-weight:700;color:#8B1A1A;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px">⚠ Overdue (${overdue.length})</div>${overdue.map(compCard).join('')}<div style="margin-bottom:20px"></div>`;
  if(soon.length)     html+=`<div style="font-size:11px;font-weight:700;color:#8B6914;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px">Due Within 90 Days (${soon.length})</div>${soon.map(compCard).join('')}<div style="margin-bottom:20px"></div>`;
  if(upcoming.length) html+=`<div style="font-size:11px;font-weight:700;color:#1B5E20;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px">Upcoming (${upcoming.length})</div>${upcoming.map(compCard).join('')}`;

  el('tab-content').innerHTML = html;
}

// ── TAB ROUTING ───────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  destroyCharts();
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  const renders = {dashboard:renderDashboard, llcs:renderLLCs, performance:renderPerformance, mortgages:renderMortgages, loans:renderLoans, investments:renderInvestments, rental:renderRental, compliance:renderCompliance};
  if(renders[tab]) renders[tab]();
}

function llcOptHTML(val='') {
  return state.llcs.map(l=>`<option value="${esc(l.name)}" ${l.name===val?'selected':''}>${esc(l.name)}</option>`).join('');
}
function fieldHTML(label,name,val='',opts={}) {
  const {type='text',prefix='',half=false,placeholder=''}=opts;
  const pw=prefix?`<div class="input-wrap"><span class="prefix">${prefix}</span><input class="with-prefix" type="text" inputmode="decimal" name="${name}" value="${esc(fmtCommas(val))}" placeholder="${esc(placeholder)}"/></div>`:`<input type="text" ${type==='number'?'inputmode="decimal"':''} name="${name}" value="${esc(type==='number'?fmtCommas(val):val)}" placeholder="${esc(placeholder)}"/>`;
  return `<div class="field${half?' half':''}"><label>${label}</label>${pw}</div>`;
}
function selectHTML(label,name,options,val='',half=false) {
  const opts = options.map(o=>typeof o==='string'?{v:o,l:o}:o).map(o=>`<option value="${esc(o.v)}" ${o.v===val?'selected':''}>${esc(o.l)}</option>`).join('');
  return `<div class="field${half?' half':''}"><label>${label}</label><select name="${name}"><option value="">— Select —</option>${opts}</select></div>`;
}

function modalHTML(title, bodyHTML) {
  return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">

      <div class="modal-body">${bodyHTML}</div>
    </div>
  </div>`;
}

function closeModal() { el('modal-container').innerHTML = ''; }

function findItem(type, id) {
  const map = {llc:'llcs',mortgage:'mortgages',loan:'investments',investment:'investmentItems',rental:'rentalItems',compliance:'complianceItems'};
  return (state[map[type]]||[]).find(i=>i.id===id);
}

function getFormData(form) {
  const data = {};
  new FormData(form).forEach((v,k)=>data[k]=v);
  // Also grab inputs not in FormData (text inputs)
  form.querySelectorAll('input,select').forEach(inp=>{
    if(inp.name) data[inp.name] = inp.value;
  });
  return data;
}

async function submitModal(type, id) {
  const form = document.querySelector('.modal-body');
  const raw = {};
  form.querySelectorAll('input[name],select[name]').forEach(inp=>raw[inp.name]=inp.value);

  // Strip commas from number fields
  const numFields = ['assets','cash','revenue','original','remaining','monthly','value','cost','monthlyRent','expenses','sqft','rev2023','rev2024','rev2025','revYTD','revTarget','ni2023','ni2024','ni2025','netIncomeYTD','netIncomeTarget','overheadYTD','overheadTarget','primaryPct','secondaryPct','members','rate','term'];
  numFields.forEach(f=>{ if(raw[f]) raw[f]=stripC(raw[f]); });

  // Handle custom LLC
  if(raw.llc==='__custom__') raw.llc = raw.llcCustom||'';

  const item = { ...raw, id: id||uid() };

  // Save to state
  const stateMap = {llc:'llcs',mortgage:'mortgages',loan:'investments',investment:'investmentItems',rental:'rentalItems',compliance:'complianceItems'};
  const stateKey = stateMap[type];
  const idx = state[stateKey].findIndex(i=>i.id===item.id);
  if(idx>=0) state[stateKey][idx]=item; else state[stateKey].push(item);

  closeModal();
  switchTab(currentTab);

  // Save to Supabase
  await saveItem(type, item);
}

async function doDelete(type, id) {
  if(!confirm('Delete this item?')) return;
  const stateMap = {llcs:'llcs',mortgages:'mortgages',loans:'investments',investment:'investmentItems',rental:'rentalItems',compliance:'complianceItems'};
  const stateKey = stateMap[type];
  state[stateKey] = (state[stateKey]||[]).filter(i=>i.id!==id);
  switchTab(currentTab);
  await deleteItem(type, id);
}

async function init() {

    const navTabs = el('nav-tabs');
    tabs.forEach(t=>{

      btn.className='nav-tab'+(t==='dashboard'?' active':'');
      btn.dataset.tab=t; btn.textContent=tabLabels[t];
      btn.onclick=()=>switchTab(t);
      navTabs.appendChild(btn);
    });

    // Owner name
    const ownerInput = el('owner-name');
    ownerInput.value = state.ownerName;
    ownerInput.onchange = async () => {
      state.ownerName = ownerInput.value;
      await sbPatch('portfolio_settings',{owner_name:ownerInput.value},'id=neq.null');
    };

    switchTab('dashboard');
  } catch(e) {
    console.error('Init failed:', e);
    el('loading-screen').innerHTML = `
      <div style="text-align:center;max-width:480px;padding:40px;font-family:Georgia,serif">
        <div style="font-size:36px;margin-bottom:16px">⚠</div>
        <div style="font-size:20px;font-weight:700;color:#1A2332;margin-bottom:12px">Connection Failed</div>
        <div style="font-size:14px;color:#6B7A8D;line-height:1.6;margin-bottom:16px">Could not connect to the database.<br>Error: ${e.message}</div>
        <div style="font-size:13px;color:#8A9BB0">Make sure you have an internet connection and try refreshing the page.</div>
        <button onclick="location.reload()" style="margin-top:20px;background:#1E3A5F;color:#fff;border:none;padding:10px 24px;border-radius:6px;font-size:14px;cursor:pointer;font-family:Georgia,serif">Retry</button>
      </div>`;
  }
}

init();
</script>
